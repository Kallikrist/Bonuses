plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def envStorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStoreFile = null
if (envStorePath != null && !envStorePath.isEmpty()) {
    releaseStoreFile = file(envStorePath)
    if (!releaseStoreFile.exists()) {
        throw new GradleException("ANDROID_KEYSTORE_PATH is set but the file does not exist: ${envStorePath}")
    }
} else if (keystoreProperties["storeFile"] != null) {
    releaseStoreFile = file(keystoreProperties["storeFile"])
}

def useReleaseKeystore = releaseStoreFile != null && releaseStoreFile.exists()

android {
    namespace = "com.bonuses.app.bonuses"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.bonuses.app.bonuses"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23  // Firebase requires minSdkVersion 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (useReleaseKeystore) {
                keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProperties["keyAlias"]
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProperties["keyPassword"]
                storeFile = releaseStoreFile
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (useReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                // Local `flutter run --release` still works without a keystore.
                // CI must set ANDROID_KEYSTORE_PATH so App Distribution is not debug-signed.
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
