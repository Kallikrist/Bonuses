# Distribute tester builds on merge to main.
#
# Jobs:
#   ios-testflight     — signed IPA → App Store Connect / TestFlight
#   android-firebase   — signed APK → Firebase App Distribution
#
# Trigger: push to main, or workflow_dispatch (documented equivalent for a
# dry run after secrets exist, without waiting for another merge).
#
# This workflow does not enable live Stripe. DEMO_MODE=true is hardcoded in
# scripts/ci/release_dart_defines.sh. Do not pass STRIPE_* keys here.
#
# App Distribution does not require Firebase in the Flutter app. Do not add
# google-services.json / firebase_options.dart.
#
# ---------------------------------------------------------------------------
# Owner setup (GitHub repo → Settings → Secrets and variables → Actions)
# ---------------------------------------------------------------------------
# Apple
#   1. Enroll in the Apple Developer Program.
#   2. In App Store Connect, create app bundle id com.bonuses.app.bonuses
#      (must match ios/Runner PRODUCT_BUNDLE_IDENTIFIER).
#   3. Create an App Store Connect API key (Users and Access → Integrations):
#      role App Manager. Download the .p8 once. Note Key ID and Issuer ID.
#   4. Create an iOS Distribution certificate (.p12) and an App Store
#      provisioning profile for com.bonuses.app.bonuses. Export the cert
#      from Keychain as PKCS#12.
#   5. Secrets:
#        APP_STORE_CONNECT_API_KEY_ID
#        APP_STORE_CONNECT_ISSUER_ID
#        APP_STORE_CONNECT_API_KEY_P8_BASE64   (base64 of the .p8)
#        IOS_CERTIFICATE_P12_BASE64            (base64 of the .p12)
#        IOS_CERTIFICATE_PASSWORD
#        IOS_PROVISIONING_PROFILE_BASE64       (base64 of the .mobileprovision)
#        IOS_TEAM_ID                           (10-char team id; optional if
#                                              the profile embeds it)
#
# Firebase (distribution only — not a product SDK)
#   1. Create a Firebase project (or reuse one).
#   2. Add an Android app with package name com.bonuses.app.bonuses.
#      Copy the app id (1:…:android:…).
#   3. Create a tester group named testers (or set FIREBASE_TESTER_GROUP).
#   4. Create a service account with Firebase App Distribution Admin.
#      Download the JSON key.
#   5. Secrets:
#        FIREBASE_ANDROID_APP_ID
#        FIREBASE_SERVICE_ACCOUNT              (raw JSON or base64 of JSON)
#        FIREBASE_TESTER_GROUP                 (optional; default testers)
#
# Android signing
#   1. Create an upload keystore (do not commit it):
#        keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA \
#          -keysize 2048 -validity 10000 -alias upload
#   2. Secrets:
#        ANDROID_KEYSTORE_BASE64               (base64 of the .jks)
#        ANDROID_KEYSTORE_PASSWORD
#        ANDROID_KEY_ALIAS
#        ANDROID_KEY_PASSWORD
#
# Optional backend (still mock payments)
#        SUPABASE_URL
#        SUPABASE_ANON_KEY
#
# Encode files:
#   base64 -i AuthKey_XXXX.p8 | pbcopy          # macOS
#   base64 -w0 upload-keystore.jks              # Linux
#
# First runs fail until the secrets above exist. That is expected.
# Product tests stay in flutter-tests.yml and are not this workflow's gate.

name: Distribute

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: distribute-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FLUTTER_CHANNEL: beta

jobs:
  ios-testflight:
    name: iOS TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Apple / signing secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8_BASE64 \
            IOS_CERTIFICATE_P12_BASE64 \
            IOS_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}. Create the Apple account, App Store Connect API key, iOS Distribution cert, and App Store profile, then add the secrets listed in the workflow header."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Import iOS certificate and provisioning profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          CI_XCCONFIG="${GITHUB_WORKSPACE}/ios/Flutter/CodeSign.ci.xcconfig"

          echo -n "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          TEAM_ID="${IOS_TEAM_ID:-$PROFILE_TEAM}"
          if [ -z "$TEAM_ID" ]; then
            echo "::error::Could not determine IOS_TEAM_ID from the provisioning profile. Set the IOS_TEAM_ID secret."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          cp "$PP_PATH" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          {
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = iPhone Distribution"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = iPhone Distribution"
            echo "DEVELOPMENT_TEAM = ${TEAM_ID}"
            echo "PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}"
          } > "$CI_XCCONFIG"

          python3 scripts/ci/write_ios_export_options.py \
            --output "$EXPORT_PLIST" \
            --team-id "$TEAM_ID" \
            --profile-name "$PROFILE_NAME"

          echo "IOS_EXPORT_OPTIONS_PLIST=$EXPORT_PLIST" >> "$GITHUB_ENV"
          echo "Imported profile ${PROFILE_NAME} (${PROFILE_UUID}) for team ${TEAM_ID}"

      - name: Build iOS IPA (mock payments)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          source scripts/ci/release_dart_defines.sh
          echo "Building IPA with DEMO_MODE=true DEBUG_MODE=false build-number=${RELEASE_BUILD_NUMBER}"
          flutter build ipa \
            --release \
            --build-number="$RELEASE_BUILD_NUMBER" \
            --export-options-plist="$IOS_EXPORT_OPTIONS_PLIST" \
            "${RELEASE_DART_DEFINES[@]}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          IPA="$(ls build/ios/ipa/*.ipa | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found under build/ios/ipa"
            exit 1
          fi
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          chmod 700 "$API_PRIVATE_KEYS_DIR"
          KEY_PATH="$API_PRIVATE_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          if [[ "$APP_STORE_CONNECT_API_KEY_P8_BASE64" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" > "$KEY_PATH"
          else
            echo -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

  android-firebase:
    name: Android Firebase App Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Android / Firebase secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            FIREBASE_ANDROID_APP_ID \
            FIREBASE_SERVICE_ACCOUNT
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}. Create the Android upload keystore and a Firebase project with App Distribution, then add the secrets listed in the workflow header."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Android APK (mock payments)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          source scripts/ci/release_dart_defines.sh
          echo "Building APK with DEMO_MODE=true DEBUG_MODE=false build-number=${RELEASE_BUILD_NUMBER}"
          flutter build apk \
            --release \
            --build-number="$RELEASE_BUILD_NUMBER" \
            "${RELEASE_DART_DEFINES[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Distribute APK via Firebase App Distribution
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUP: ${{ secrets.FIREBASE_TESTER_GROUP }}
        run: |
          set -euo pipefail
          SA_PATH="$RUNNER_TEMP/firebase-sa.json"
          if [[ "${FIREBASE_SERVICE_ACCOUNT}" == \{* ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_PATH"
          else
            echo -n "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > "$SA_PATH"
          fi
          chmod 600 "$SA_PATH"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_PATH"
          npm install -g firebase-tools
          GROUP="${FIREBASE_TESTER_GROUP:-testers}"
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$GROUP" \
            --release-notes "main ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_NUMBER})" \
            --non-interactive
