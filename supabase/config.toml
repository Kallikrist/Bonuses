# Linked to project ref hkpkznslzkgnijoahggn.
# SQL in supabase/migrations is tracked. Owner applies it; it is not auto-applied.
project_id = "hkpkznslzkgnijoahggn"

[functions.stripe-secret]
enabled = true
# App auth is local, not Supabase Auth, so callers have no user JWT.
# The Functions gateway still requires the project anon/publishable apikey.
verify_jwt = false
entrypoint = "./functions/stripe-secret/index.ts"

[functions.kling-secret]
enabled = true
# Same local-auth constraint as stripe-secret. JWT gate is BON-12 (paused).
verify_jwt = false
entrypoint = "./functions/kling-secret/index.ts"

[functions.kling-webhook]
enabled = true
# Kling POSTs with X-Kling-Signature, not a Supabase user JWT.
# Gateway still requires the project anon/publishable apikey (query or header).
verify_jwt = false
entrypoint = "./functions/kling-webhook/index.ts"
